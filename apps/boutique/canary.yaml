apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: frontend
  namespace: boutique
spec:
  provider: nginx
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  ingressRef:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    name: frontend
  service:
    port: 80
    targetPort: 8080
  analysis:
    interval: 30s
    threshold: 5
    maxWeight: 50
    stepWeight: 10
    # metrics:
    #   - name: request-success-rate
    #     thresholdRange:
    #       min: 99
    #     interval: 1m