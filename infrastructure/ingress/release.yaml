apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: ingress-nginx
  namespace: ingress-nginx

spec:
  interval: 5m

  chart:
    spec:
      chart: ingress-nginx

      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  values:
    controller:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          namespace: monitoring
          additionalLabels:
            release: kube-prometheus-stack
      service:
        annotations:
          service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/healthz"
          external-dns.alpha.kubernetes.io/hostname: ui.tenant1.cav-test.com

