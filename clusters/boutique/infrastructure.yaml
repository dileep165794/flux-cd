apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 5m
  path: ./infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-personal-source
  wait: true
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system
spec:
  interval: 5m
  path: ./infrastructure/cert-manager-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-personal-source
  dependsOn:
    - name: infrastructure
  wait: true
  timeout: 5m