# Clean Multi-Source Manifest - BOUTIQUE ONLY
---
# 1. External Source: Boutique Application Repo
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: boutique-source
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: Sandeep/BoutiqueCoupon
  secretRef:
    name: flux-system
  url: https://github.com/Shiv0388/microservices-demo.git

---
# 2. Deploy Boutique Application Manifests
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: boutique-apps
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes-manifests
  prune: true
  targetNamespace: boutique
  sourceRef:
    kind: GitRepository
    name: boutique-source

---
# 3. Personal Source: Your Config Repo (for Canary rules)
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: https://github.com/dileep165794/flux-cd.git

---
# 4. Deploy Canary Configuration from Your Personal Repo
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: boutique-canary
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./apps/boutique
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: boutique-apps